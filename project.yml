name: Raspisanie
options:
  bundleIdPrefix: com.nofy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  Raspisanie:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: RaspisanieWidget
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nofy.raspisanie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Расписание
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  RaspisanieWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Расписание
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nofy.raspisanie.widget
